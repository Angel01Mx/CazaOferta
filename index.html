<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CazaOferta - Las mejores ofertas del día</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #ff7d00;
      --primary-dark: #e06c00;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --discount: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-bottom: 2px solid var(--primary);
      padding: 20px 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .brand i { font-size: 2rem; color: var(--primary); }
    .brand h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
    .brand span { color: var(--primary); }

    .search-bar {
      max-width: 500px;
      margin: 0 auto 12px;
      position: relative;
    }
    .search-bar input {
      width: 100%;
      padding: 12px 40px 12px 15px;
      border-radius: 25px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-bar input:focus { border-color: var(--primary); }
    .search-bar i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 5px 0;
      max-width: 1200px;
      margin: 0 auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(255, 125, 0, 0.15);
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--discount);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      z-index: 2;
    }

    .card-img {
      width: 100%;
      height: 200px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .card-img img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.95rem;
      line-height: 1.3;
      height: 2.6em;
      overflow: hidden;
      margin-bottom: 10px;
      color: var(--text);
    }

    .prices {
      margin-top: auto;
      margin-bottom: 12px;
    }
    .price-old {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }
    .price-current {
      font-size: 1.3rem;
      font-weight: 800;
      color: #22c55e;
    }

    .btn-buy {
      display: block;
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn-buy:hover { background: var(--primary-dark); }

    .loading, .empty {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-fox"></i>
      <h1>Caza<span>Oferta</span></h1>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar productos u ofertas...">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>

    <div class="categories" id="categoryContainer">
      <button class="cat-btn active" onclick="filtrar('Todas')">Todas</button>
      <button class="cat-btn" onclick="filtrar('Celulares y Telefonía')">Celulares</button>
      <button class="cat-btn" onclick="filtrar('Consolas y Videojuegos')">Videojuegos</button>
      <button class="cat-btn" onclick="filtrar('Computación')">Computación</button>
      <button class="cat-btn" onclick="filtrar('Hogar, Muebles y Jardín')">Hogar</button>
      <button class="cat-btn" onclick="filtrar('Ropa y Calzado')">Ropa</button>
      <button class="cat-btn" onclick="filtrar('Accesorios para Vehículos')">Automotriz</button>
    </div>
  </header>

  <div class="container">
    <div class="grid" id="productGrid">
      <div class="loading">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 10px;">Cargando las mejores ofertas...</p>
      </div>
    </div>
  </div>

  <script>
    let todasLasOfertas = [];
    let categoriaActual = 'Todas';

    async function cargarOfertas() {
      try {
        const res = await fetch('ofertas.json');
        if (!res.ok) throw new Error("No se encontró el catálogo todavía");
        todasLasOfertas = await res.json();
        renderizar();
      } catch (err) {
        document.getElementById('productGrid').innerHTML = `
          <div class="empty">
            <p>¡El robot está preparando el catálogo inicial!</p>
            <p style="font-size: 0.85rem; margin-top: 5px;">Recarga esta página en un par de minutos.</p>
          </div>
        `;
      }
    }

    function renderizar() {
      const grid = document.getElementById('productGrid');
      const busqueda = document.getElementById('searchInput').value.toLowerCase();

      const filtrados = todasLasOfertas.filter(p => {
        const coincideCat = categoriaActual === 'Todas' || p.categoria === categoriaActual;
        const coincideBusqueda = p.titulo.toLowerCase().includes(busqueda);
        return coincideCat && coincideBusqueda;
      });

      if (filtrados.length === 0) {
        grid.innerHTML = '<div class="empty"><p>No encontramos ofertas con ese criterio de búsqueda.</p></div>';
        return;
      }

      grid.innerHTML = filtrados.map(p => `
        <div class="card">
          <span class="badge">-${p.descuento}%</span>
          <div class="card-img">
            <img src="${p.imagen}" alt="${p.titulo}" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-title">${p.titulo}</div>
            <div class="prices">
              <div class="price-old">$${p.precio_anterior.toLocaleString('es-MX')}</div>
              <div class="price-current">$${p.precio_oferta.toLocaleString('es-MX')}</div>
            </div>
            <a href="${p.link}" target="_blank" rel="noopener" class="btn-buy">Ver Oferta</a>
          </div>
        </div>
      `).join('');
    }

    function filtrar(cat) {
      categoriaActual = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.trim() === cat || (cat === 'Todas' && btn.innerText.trim() === 'Todas'));
      });
      renderizar();
    }

    document.getElementById('searchInput').addEventListener('input', renderizar);
    document.addEventListener('DOMContentLoaded', cargarOfertas);
  </script>
</body>
</html>
